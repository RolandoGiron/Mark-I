# Docker Compose para desarrollo local (solo servicios de infraestructura)
# El backend se ejecuta directamente con uvicorn para hot-reload
version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: mark-i-db-dev
    environment:
      POSTGRES_DB: obras
      POSTGRES_USER: obras_user
      POSTGRES_PASSWORD: obras_pass
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obras_user -d obras"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: mark-i-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    command: redis-server --appendonly yes

  # MinIO
  minio:
    image: minio/minio:latest
    container_name: mark-i-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data_dev:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  postgres_data_dev:
  redis_data_dev:
  minio_data_dev:
