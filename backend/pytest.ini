[pytest]
# Configuración de pytest para Mark-I Backend

# Marcadores de tests personalizados
markers =
    unit: Tests unitarios
    integration: Tests de integración
    e2e: Tests end-to-end
    slow: Tests lentos
    auth: Tests de autenticación
    proyectos: Tests de proyectos
    costos: Tests de costos
    admin: Tests que requieren rol admin
    personal: Tests de personal/empleados
    tareas: Tests de tareas
    horas: Tests de registro de horas
    notificaciones: Tests de notificaciones

# Opciones por defecto
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # --cov-fail-under=80  # Descomenta cuando todos los tests estén listos

# Directorios a incluir en tests
testpaths = tests

# Patrón de archivos de test
python_files = test_*.py

# Patrón de clases de test
python_classes = Test*

# Patrón de funciones de test
python_functions = test_*

# Modo asyncio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Deshabilitar warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
